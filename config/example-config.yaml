# TsunamiWall example configuration file.
# Copy this to /etc/tsunamiwall/config.yaml or ~/.config/tsunamiwall/config.yaml
# and edit as needed. All keys are optional; missing values use built-in defaults.

# Port range used for honeypot listeners.
honeypot_start: 10000
honeypot_end: 65535

# Maximum number of honeypot listeners to start. Keep this below the Linux
# process soft file-descriptor limit (usually 1024) unless you have raised it.
max_honeypots: 900

# How often (seconds) to re-scan listening sockets and reconcile rules.
discovery_interval: 30.0

# Name of the iptables chain managed by TsunamiWall.
iptables_chain: "TSUNAMIWALL"

# Trusted source IPs or CIDR blocks that bypass the firewall entirely.
# Add your management IP here so you do not lock yourself out.
trusted_ips: []
# trusted_ips:
#   - "203.0.113.45"
#   - "198.51.100.0/24"
#   - "2001:db8::/32"

# Strict default-deny mode. When true, discovered listening sockets are NOT
# automatically allowed; only ports explicitly added with `allow` are opened.
# Use this for a stricter firewall posture. Default is false.
auto_block_listeners: false
# SECURITY NOTE: leaving this false means every listening socket (SSH, web,
# database, etc.) is automatically allowed inbound. Set to true and add your
# management IP to trusted_ips before enabling on production servers if you
# want a real default-deny policy.

# Payload capture from honeypot connections.
# When enabled, TsunamiWall reads up to payload_max_bytes from each probe and
# writes it to /var/log/tsunamiwall/bycountry/{CC}/{IP}/{timestamp}_{dst_port}.bin
# plus a metadata JSONL file called sessions.logl.
payload_max_bytes: 4096
payload_read_timeout: 2.0
payload_log_dir: "/var/log/tsunamiwall/bycountry"

# Directories and file names.
log_dir: "/var/log/tsunamiwall"
run_dir: "/run/tsunamiwall"
hit_log_name: "hits.logl"
# socket_path and pid_path are derived from run_dir and are no longer configurable.

# Log/payload rotation and rate limiting.
hit_log_max_bytes: 104857600      # 100 MiB per hits.logl before rotation
hit_log_max_backups: 5            # keep hits.logl.1 through .5
payload_log_max_bytes: 1073741824 # 1 GiB total payload storage cap
log_rate_limit: 10                # average LOG packets/second
log_rate_burst: 20               # LOG burst before rate limiting kicks in

# IPv6 support. Set to true on dual-stack hosts so TsunamiWall also manages an
# ip6tables chain. Honeypots will listen on both IPv4 and IPv6.
enable_ipv6: false

# Firewall backend. "auto" selects iptables on Linux and pfctl on macOS.
# Other values: "iptables", "pfctl", "noop" (no firewall rules; useful for
# testing or unsupported platforms). Default is "auto".
firewall_backend: "auto"

# Base pfctl anchor name when using the pfctl backend on macOS. TsunamiWall
# loads rules into sub-anchors <pfctl_anchor>/ipv4 and <pfctl_anchor>/ipv6.
# You must reference the base anchor in /etc/pf.conf once:
#   anchor "tsunamiwall/*"
# and then run `sudo pfctl -f /etc/pf.conf` to activate it.
pfctl_anchor: "tsunamiwall"
