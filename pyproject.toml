[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsunamiwall"
version = "1.3.2"
description = "Linux server firewall with stealth per-port honeypot listeners"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]
authors = [
    {name = "TsunamiWall Contributors"},
]
keywords = ["firewall", "honeypot", "security", "iptables", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Firewalls",
]

[project.scripts]
tsunamiwall = "tsunamiwall.cli:main"
tsunamiwall-reset = "tsunamiwall.emergency:main"

[tool.hatch.build.targets.wheel]
packages = ["tsunamiwall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
